name: quickquiz
description: "QuickQuiz - Turn Your Notes Into Knowledge"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Routing
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.2.0
  cloud_functions: ^5.1.3

  # Auth
  google_sign_in: ^6.2.1

  # Local persistence
  shared_preferences: ^2.2.3

  # File handling
  file_picker: ^8.0.6

  # Document parsing
  syncfusion_flutter_pdf: ^26.2.14
  # DOCX and PPTX are both just zipped XML under the hood, so both are
  # parsed manually via archive + xml (see DocumentParserService) rather
  # than pulling in a separate docx-specific package.
  archive: ^3.6.1
  xml: ^6.5.0

  # Networking
  dio: ^5.5.0+1

  # Ads
  google_mobile_ads: ^7.0.0

  # UI / media
  cached_network_image: ^3.4.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

  # Env config (keeps API URLs / ad unit IDs out of source)
  flutter_dotenv: ^5.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  equatable: ^2.0.5
  connectivity_plus: ^6.0.5

  cupertino_icons: ^1.0.8
  google_generative_ai: ^0.4.7
  flutter_native_splash: ^2.4.1
  permission_handler: 11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/icon/
    - assets/data/

flutter_native_splash:
  color: "#7B3FF2"
  image: assets/images/quickquiz_logo.png
  android_12:
    color: "#7B3FF2"
    image: assets/images/quickquiz_logo.png
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon_full.png"
  min_sdk_android: 21
  adaptive_icon_background: "#7B3FF2"
  adaptive_icon_foreground: "assets/icons/quickquiz_logo.png"


